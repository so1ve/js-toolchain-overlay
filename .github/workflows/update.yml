name: Update versions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31

      - name: Update versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update

      - name: Detect updates
        id: changes
        run: |
          if git diff --quiet -- versions; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "The index is up to date." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            git diff --stat -- versions >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Build updated releases
        if: steps.changes.outputs.changed == 'true'
        run: >-
          nix build --no-link
          .#node .#node_lts .#bun .#deno .#deno_lts .#pnpm .#yarn
          .#checks.x86_64-linux.package-managers

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add versions
          git commit --message "chore: update versions"
          git push origin "HEAD:$DEFAULT_BRANCH"
